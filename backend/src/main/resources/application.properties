# Spring Application
spring.application.name=nexus-pulse-backend
server.port=8080

# AWS Configuration - UPDATE THESE AFTER CDK DEPLOY
aws.dynamodb.table-name=${DYNAMODB_TABLE_NAME:EventsTable}
aws.sqs.queue-url=${SQS_QUEUE_URL:https://sqs.us-east-1.amazonaws.com/123456789012/nexus-pulse-queue}

# Logging - AGENTS.md 4.4: Structured logging with traceId
logging.level.root=INFO
logging.level.com.nexuspulse.backend=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [traceId=%X{traceId}] [eventId=%X{eventId}] - %msg%n

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Validation
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false
